  <body>
    <div id="root"></div>
    <script>
      try {
        if (localStorage.getItem('u1-view') === 'board') {
          const hero = document.querySelector('#root .hero');
          if (hero) {
            hero.classList.remove('is-schematic');
            hero.classList.add('is-board');
            const buttons = hero.querySelectorAll('.view-switch button');
            buttons.forEach((button, index) => button.setAttribute('aria-pressed', String(index === 1)));
          }
        }
      } catch {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
